
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101c18">

  <title>NerdXD Collectibles</title>

  <style>

    /* ========================================
       NERDXD COLLECTIBLES — HOMEPAGE
       Brownist Font Edition
       ======================================== */

    @font-face {
      font-family: "Brownist";
      src: url("./overlay/fonts/Brownist.woff2")
           format("woff2");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }

    :root {
      --green: #09ff6d;
      --bg: #101c18;
      --text: #e8f5ec;
      --muted: #a8bcb0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;

      font-family:
        "Brownist", "Trebuchet MS", Arial, sans-serif;

      color: var(--text);

      background: radial-gradient(
        ellipse at 50% 40%,
        #214e32 0%,
        #13281d 45%,
        #080f0c 100%
      );

      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;

      background: radial-gradient(
        circle at center,
        transparent 30%,
        rgba(0, 0, 0, .55) 100%
      );
    }

    /* MAIN CONTAINER */

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 850px;
      padding: 48px 22px;
      text-align: center;
    }

    /* HEADER */

    .eyebrow {
      font-size: 12px;
      letter-spacing: 4px;
      color: #9ce7b5;
      font-weight: 400;
      margin-bottom: 14px;
    }

    h1 {
      font-size: clamp(48px, 11vw, 96px);
      line-height: .95;
      letter-spacing: -3px;
      margin: 0;
      font-weight: 400;

      text-shadow:
        0 5px 25px rgba(0, 0, 0, .53);
    }

    h2 {
      font-size: clamp(24px, 6vw, 43px);
      letter-spacing: 6px;
      color: var(--green);
      margin: 10px 0 24px;
      font-weight: 400;

      text-shadow:
        0 0 25px rgba(9, 255, 109, .4);
    }

    /* DESCRIPTION */

    .description {
      color: #c3d8cb;
      line-height: 1.7;
      font-size: 16px;
      max-width: 490px;
      margin: 0 auto 30px;
    }

    /* FLOATING CARD */

    .card-wrap {
      position: relative;
      width: min(245px, 58vw);
      margin: 0 auto 38px;

      animation:
        float 5s ease-in-out infinite;
    }

    .card-wrap::before {
      content: "";
      position: absolute;
      inset: 10%;

      background: var(--green);
      filter: blur(55px);
      opacity: .32;
      border-radius: 50%;
      pointer-events: none;
    }

    .card {
      position: relative;
      display: block;
      width: 100%;
      height: auto;

      /* Preserve the original card artwork */
      border-radius: 0;

      filter: drop-shadow(
        0 15px 28px rgba(0, 0, 0, .65)
      );
    }

    @keyframes float {
      0%, 100% {
        transform:
          translateY(0) rotate(-2deg);
      }

      50% {
        transform:
          translateY(-13px) rotate(2deg);
      }
    }

    /* ENTER COLLECTION BUTTON */

    .enter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;

      text-decoration: none;
      font-family: inherit;

      background: var(--green);
      color: #06180e;

      font-size: 18px;
      font-weight: 400;
      letter-spacing: 1px;

      border-radius: 12px;
      padding: 18px 34px;

      box-shadow:
        0 0 30px rgba(9, 255, 109, .27);

      transition:
        transform .2s ease,
        box-shadow .2s ease;
    }

    .enter:hover,
    .enter:focus-visible {
      transform: translateY(-3px);

      box-shadow:
        0 0 45px rgba(9, 255, 109, .53);
    }

    .enter:focus-visible {
      outline: 3px solid white;
      outline-offset: 4px;
    }

    /* COLLECTION INFORMATION */

    .info {
      margin-top: 35px;
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--muted);
    }

    footer {
      margin-top: 24px;
      color: #789786;
      font-size: 12px;
    }

    /* MOBILE RESPONSIVENESS */

    @media (max-width: 600px) {
      .container {
        padding: 34px 18px;
      }

      h1 {
        letter-spacing: -1px;
      }

      h2 {
        letter-spacing: 3px;
      }

      .card-wrap {
        margin-bottom: 28px;
      }

      .description {
        font-size: 14px;
      }

      .enter {
        width: min(100%, 330px);
      }

      .info {
        line-height: 2;
      }
    }

    /* ACCESSIBILITY */

    @media (prefers-reduced-motion: reduce) {
      .card-wrap {
        animation: none;
      }

      .enter {
        transition: none;
      }
    }

  </style>
</head>

<body>

  <main class="container">

    <div class="eyebrow">
      WELCOME TO THE COLLECTION
    </div>

    <h1>NERDXD</h1>
    <h2>COLLECTIBLES</h2>

    <p class="description">
      A mysterious collection awaits.
      Check in during NerdXD streams,
      discover collectible cards,
      and build your collection.
    </p>

    <div class="card-wrap">
      <img
        class="card"
        src="./cards/card-back.png"
        alt="NerdXD Collectibles card back"
      >
    </div>

    <a class="enter" href="./collection/">
      ENTER COLLECTION
      <span aria-hidden="true">&#8594;</span>
    </a>

    <div class="info">
      12 CARDS &nbsp;·&nbsp;
      4 RARITIES &nbsp;·&nbsp;
      SERIES 1
    </div>

    <footer>
      A NerdXD Community Experience
    </footer>

  </main>

</body>
</html>
